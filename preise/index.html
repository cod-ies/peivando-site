<body class="pricing-page">
  <header class="pricing-shell" id="pricing-shell">
    <div class="wrap pricing-shell-in">
      <a class="pricing-brand" href="/" aria-label="Peivando">
        <svg width="27" height="27" viewBox="0 0 40 40" aria-hidden="true">
          <g fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-linecap="round">
            <path d="M20 20 20 8M20 20 30.4 14M20 20 30.4 26M20 20 20 32M20 20 9.6 26M20 20 9.6 14" opacity=".5"/>
            <path d="M20 8 30.4 14 30.4 26 20 32 9.6 26 9.6 14Z" opacity=".28"/>
          </g>
          <g fill="var(--teal)">
            <circle cx="20" cy="8" r="2.3"/><circle cx="30.4" cy="14" r="2.3"/><circle cx="30.4" cy="26" r="2.3"/>
            <circle cx="20" cy="32" r="2.3"/><circle cx="9.6" cy="26" r="2.3"/><circle cx="9.6" cy="14" r="2.3"/>
            <circle cx="20" cy="20" r="3.9"/>
          </g>
        </svg>
        <b>Peivando</b>
      </a>
      <a class="pricing-shell-link" href="/#contact">Kontakt</a>
    </div>
  </header>

  <main>
    <peivando-pricing heading="h1">
      <noscript>
        <section class="pricing-section">
          <div class="wrap">
            <div class="pricing-head">
              <p class="mono">Preise</p>
              <h1>Drei Pakete. Preise in Euro.</h1>
              <p class="lede">Starter, Business und Mehrsprachig — Startpreise ohne Scheinrabatte.</p>
            </div>
            <div class="pricing-grid">
              <article class="pricing-card">
                <p class="mono">One Page</p>
                <h3>Starter</h3>
                <p class="pricing-amount">ab €399</p>
                <ul class="pricing-features">
                  <li>Design und Aufbau</li>
                  <li>Mobilfreundlich</li>
                  <li>Kontaktformular</li>
                  <li>WhatsApp-Button</li>
                  <li>Domain anbinden</li>
                </ul>
              </article>
              <article class="pricing-card is-featured">
                <p class="mono">Professionelle Website</p>
                <h3>Business</h3>
                <p class="pricing-amount">ab €899</p>
                <ul class="pricing-features">
                  <li>Bis zu fünf Seiten</li>
                  <li>Responsive auf Handy, Tablet und Desktop</li>
                  <li>SEO-Grundlagen</li>
                  <li>Kontaktformular</li>
                  <li>Google Maps</li>
                  <li>Analytics</li>
                </ul>
              </article>
              <article class="pricing-card">
                <p class="mono">Deutsch plus eine Sprache</p>
                <h3>Mehrsprachig</h3>
                <p class="pricing-amount">ab €1.290</p>
                <ul class="pricing-features">
                  <li>Deutsch plus eine weitere Sprache</li>
                  <li>Echtes RTL-Layout</li>
                  <li>Sprachumschaltung</li>
                  <li>SEO je Sprache</li>
                  <li>Typografie, die zur Schrift passt</li>
                </ul>
              </article>
            </div>
          </div>
        </section>
      </noscript>
    </peivando-pricing>
  </main>

  <footer class="pricing-foot">
    <div class="wrap pricing-foot-in">
      <p class="mono">© <span id="pricing-year">2026</span> Peivando · München · <a href="/">peivando.com</a></p>
    </div>
  </footer>

  <script type="module" src="../components/pricing/pricing.js"></script>
  <script>
    document.getElementById("pricing-year").textContent = String(new Date().getFullYear());
    var shell = document.getElementById("pricing-shell");
    addEventListener("scroll", function () {
      shell.classList.toggle("is-stuck", scrollY > 24);
    }, { passive: true });

    var SHELL_CONTACT = { de: "Kontakt", en: "Contact", fa: "تماس", prs: "تماس" };
    function applyShellLang() {
      var lang = "de";
      try { lang = localStorage.getItem("peivando.lang") || "de"; } catch (e) { lang = "de"; }
      var rtl = lang === "fa" || lang === "prs";
      document.body.setAttribute("dir", rtl ? "rtl" : "ltr");
      document.documentElement.lang = lang === "prs" ? "fa" : (lang === "en" ? "en" : "de");
      var link = document.querySelector(".pricing-shell-link");
      if (link && SHELL_CONTACT[lang]) link.textContent = SHELL_CONTACT[lang];
    }
    applyShellLang();
    addEventListener("peivando:lang", applyShellLang);
  </script>
</body>
</html>
